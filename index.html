<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRON_SYSTEM // QUAD_CORE_INTERFACE</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* --- GLOBAL CYBER SYSTEM RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #020208;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            color: #00ffff;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            padding: 10px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #9900ff;
            padding-bottom: 5px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #9900ff;
        }
        h1 { font-size: 1.5rem; letter-spacing: 2px; }
        #global-score-container { font-size: 1.2rem; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            height: calc(100vh - 60px);
        }
        .quadrant {
            background: rgba(5, 5, 20, 0.85);
            border: 2px solid #00ffff;
            box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.2), 0 0 15px rgba(0, 255, 255, 0.2);
            border-radius: 4px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .quadrant::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            animation: scanline 4s linear infinite;
        }
        .quad-title {
            font-size: 1rem; color: #ff00ff; text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px; border-bottom: 1px dashed rgba(255, 0, 255, 0.4);
            padding-bottom: 3px; text-shadow: 0 0 8px #ff00ff;
        }
        .quad-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        button {
            background: rgba(0, 255, 255, 0.1); border: 1px solid #00ffff; color: #00ffff;
            font-family: 'Share Tech Mono', monospace; padding: 6px 12px; cursor: pointer;
            transition: all 0.2s ease; text-shadow: 0 0 5px #00ffff;
        }
        button:hover { background: #00ffff; color: #020208; box-shadow: 0 0 15px #00ffff; }
        button:disabled { border-color: #444; color: #444; background: transparent; text-shadow: none; cursor: not-allowed; }
        @keyframes scanline {
            0% { transform: translateY(-10px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(400px); opacity: 0; }
        }

        /* --- STYLES FOR MODULE CORE PANELS --- */
        #match3-grid { display: grid; grid-template-columns: repeat(6, 40px); grid-template-rows: repeat(6, 40px); gap: 4px; background: rgba(0, 0, 0, 0.4); padding: 6px; border: 1px dashed #00ffff; }
        .match3-node { width: 40px; height: 40px; border-radius: 3px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: transform 0.15s ease; }
        .match3-node:hover { transform: scale(1.08); z-index: 2; }
        .match3-node.selected { outline: 2px solid #ffffff; box-shadow: 0 0 15px #ffffff !important; }
        .node-cyan { background: rgba(0, 255, 255, 0.2); border: 1px solid #00ffff; color: #00ffff; }
        .node-purple { background: rgba(153, 0, 255, 0.2); border: 1px solid #9900ff; color: #9900ff; }
        .node-green { background: rgba(0, 255, 102, 0.2); border: 1px solid #00ff66; color: #00ff66; }
        .node-orange { background: rgba(255, 102, 0, 0.2); border: 1px solid #ff6600; color: #ff6600; }

        #text-console { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 5px; }
        #terminal-log { flex-grow: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid #9900ff; padding: 10px; font-size: 0.9rem; line-height: 1.4; overflow-y: auto; color: #d8b4fe; margin-bottom: 10px; }
        #action-panel { display: flex; gap: 8px; flex-wrap: wrap; }
        .action-choice { flex: 1 1 calc(50% - 4px); border-color: #9900ff; color: #d8b4fe; font-size: 0.85rem; background: rgba(153, 0, 255, 0.1); }

        #simon-panel { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        #simon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 160px; height: 160px; }
        .simon-pad { width: 75px; height: 75px; border-radius: 4px; cursor: pointer; opacity: 0.25; transition: opacity 0.15s ease; }
        #pad-0 { background: #00ffff; border: 2px solid #00ffff; }
        #pad-1 { background: #9900ff; border: 2px solid #9900ff; }
        #pad-2 { background: #00ff66; border: 2px solid #00ff66; }
        #pad-3 { background: #ff6600; border: 2px solid #ff6600; }
        .simon-pad.active { opacity: 1.0 !important; }
        #simon-status { font-size: 0.9rem; color: #00ffff; height: 18px; }

        #clicker-panel { display: flex; flex-direction: column; align-items: center; justify-content: space-around; width: 100%; height: 100%; padding: 5px; }
        #stats-bar { display: flex; justify-content: space-between; width: 100%; font-size: 0.9rem; border: 1px dashed rgba(255, 102, 0, 0.3); padding: 6px; background: rgba(0, 0, 0, 0.3); }
        #reactor-node { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #ff6600; color: #ff6600; display: flex; justify-content: center; align-items: center; cursor: pointer; margin: 10px 0; }
        #reactor-node:active { transform: scale(0.92); background: rgba(255, 102, 0, 0.4); }
        #upgrades-container { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .upgrade-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 102, 0, 0.08); border: 1px solid rgba(255, 102, 0, 0.4); padding: 5px 8px; font-size: 0.85rem; }
        .upgrade-btn { border-color: #ff6600; color: #ff6600; background: rgba(255, 102, 0, 0.1); padding: 3px 8px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>TRON_SYSTEM // CORE_V3.06</h1>
        <div id="global-score-container">SYSTEM_INTEGRITY: <span id="global-score">000100</span></div>
    </header>

    <main>
        <section class="quadrant" id="core-match3"><h2 class="quad-title">CORE_01 // GRID_MATRIX_MATCH</h2><div class="quad-content" id="match3-container"></div></section>
        <section class="quadrant" id="core-text"><h2 class="quad-title">CORE_02 // SYSTEM_LOG_TEXT</h2><div class="quad-content" id="text-container"></div></section>
        <section class="quadrant" id="core-simon"><h2 class="quad-title">CORE_03 // BITSTREAM_SEQUENCE</h2><div class="quad-content" id="simon-container"></div></section>
        <section class="quadrant" id="core-clicker"><h2 class="quad-title">CORE_04 // DATA_HARVESTER_CLICK</h2><div class="quad-content" id="clicker-container"></div></section>
    </main>

    <script>
        /* --- GLOBAL MAIN ENGINE STATE RUNTIME --- */
        const systemState = {
            integrity: 100,
            match3Clears: 0,
            simonLevelMax: 0,
            totalRawBytes: 0,
            triggeredQuests: { q1: false, q2: false, q3: false },
            
            updateIntegrity(amount) {
                this.integrity += amount;
                document.getElementById('global-score').innerText = String(this.integrity).padStart(6, '0');
                this.evaluateQuestTriggers();
            },

            evaluateQuestTriggers() {
                if (this.integrity >= 180 && !this.triggeredQuests.q1) {
                    this.triggeredQuests.q1 = true;
                    TextEngine.unlockSpecialNode('quest_01_intercept');
                }
                if (this.integrity >= 450 && !this.triggeredQuests.q2) {
                    this.triggeredQuests.q2 = true;
                    TextEngine.unlockSpecialNode('quest_02_intercept');
                }
                if (this.integrity >= 800 && !this.triggeredQuests.q3) {
                    this.triggeredQuests.q3 = true;
                    TextEngine.unlockSpecialNode('quest_03_intercept');
                }
            }
        };

        /* --- CORE 01: MATCH-3 PUZZLE ENGINE --- */
        const Match3Engine = {
            rows: 6, cols: 6, grid: [], types: ['cyan', 'purple', 'green', 'orange'],
            symbols: { 'cyan': '⬦', 'purple': '▲', 'green': '■', 'orange': '❖' }, selectedNode: null,
            init() {
                const gridDiv = document.createElement('div'); gridDiv.id = 'match3-grid';
                document.getElementById('match3-container').appendChild(gridDiv);
                this.generateBoard(); this.renderBoard();
            },
            generateBoard() {
                do {
                    this.grid = [];
                    for (let r = 0; r < this.rows; r++) {
                        let row = []; for (let c = 0; c < this.cols; c++) row.push(this.types[Math.floor(Math.random() * this.types.length)]);
                        this.grid.push(row);
                    }
                } while (this.checkAllMatches().length > 0);
            },
            renderBoard() {
                const gridDiv = document.getElementById('match3-grid'); gridDiv.innerHTML = '';
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        const type = this.grid[r][c]; const node = document.createElement('div');
                        node.className = `match3-node node-${type}`; node.innerText = this.symbols[type];
                        node.dataset.row = r; node.dataset.col = c;
                        node.addEventListener('click', (e) => this.handleNodeClick(e.target));
                        gridDiv.appendChild(node);
                    }
                }
            },
            handleNodeClick(node) {
                const r = parseInt(node.dataset.row); const c = parseInt(node.dataset.col);
                if (!this.selectedNode) { this.selectedNode = node; node.classList.add('selected'); } 
                else {
                    const prevR = parseInt(this.selectedNode.dataset.row); const prevC = parseInt(this.selectedNode.dataset.col);
                    if ((Math.abs(r - prevR) === 1 && c === prevC) || (Math.abs(c - prevC) === 1 && r === prevR)) {
                        let temp = this.grid[r][c]; this.grid[r][c] = this.grid[prevR][prevC]; this.grid[prevR][prevC] = temp;
                        let matches = this.checkAllMatches();
                        if (matches.length > 0) { this.clearMatches(matches); systemState.updateIntegrity(matches.length * 15); } 
                        else { temp = this.grid[r][c]; this.grid[r][c] = this.grid[prevR][prevC]; this.grid[prevR][prevC] = temp; }
                    }
                    this.selectedNode.classList.remove('selected'); this.selectedNode = null; this.renderBoard();
                }
            },
            checkAllMatches() {
                let coords = [];
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols - 2; c++) {
                        let t = this.grid[r][c]; if (t && this.grid[r][c+1] === t && this.grid[r][c+2] === t) coords.push({r,c}, {r,c:c+1}, {r,c:c+2});
                    }
                }
                for (let r = 0; r < this.rows - 2; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        let t = this.grid[r][c]; if (t && this.grid[r+1][c] === t && this.grid[r+2][c] === t) coords.push({r,c}, {r:r+1,c}, {r:r+2,c});
                    }
                }
                return coords;
            },
            clearMatches(matches) {
                matches.forEach(coord => { this.grid[coord.r][coord.c] = null; });
                systemState.match3Clears++;
                this.dropNodes();
            },
            dropNodes() {
                for (let c = 0; c < this.cols; c++) {
                    for (let r = this.rows - 1; r >= 0; r--) {
                        if (this.grid[r][c] === null) {
                            for (let lookupR = r - 1; lookupR >= 0; lookupR--) {
                                if (this.grid[lookupR][c] !== null) { this.grid[r][c] = this.grid[lookupR][c]; this.grid[lookupR][c] = null; break; }
                            }
                        }
                        if (this.grid[r][c] === null) this.grid[r][c] = this.types[Math.floor(Math.random() * this.types.length)];
                    }
                }
                let cascade = this.checkAllMatches();
                if (cascade.length > 0) { setTimeout(() => { this.clearMatches(cascade); systemState.updateIntegrity(cascade.length * 20); this.renderBoard(); }, 200); }
            }
        };
        /* --- CORE 02: TEXT ROLEPLAY ENGINE --- */
        const TextEngine = {
            unlockedSectors: { match3: false, clicker: false, clearance: false, horizon: false },
            activeLogIndex: 1,
            nodes: {
                command_deck: {
                    text: () => {
                        let status = `MAINFRAME_COMMAND_DECK // STATUS: RUNNING\n`;
                        status += `------------------------------------------\n`;
                        status += `[SECTOR 01]: ${TextEngine.unlockedSectors.match3 ? '🟢 ONLINE - GRID_REALIGNED' : '🔴 LOCKED - BLOCKED (Need 180 Integrity)'}\n`;
                        status += `[SECTOR 02]: ${TextEngine.unlockedSectors.clicker ? '🟢 ONLINE - FLOOD_FILTERS' : '🔴 LOCKED - RESTRICTED (Need 450 Integrity)'}\n`;
                        status += `[SECTOR 03]: ${TextEngine.unlockedSectors.clearance ? '🟢 ONLINE - LOGS_CLEARED' : '🔴 LOCKED - SECURED (Need 800 Integrity)'}\n`;
                        if (TextEngine.unlockedSectors.horizon) { status += `------------------------------------------\n⚠️ DETECTING TRANS_HORIZON OPEN VECTOR BEACON.`; }
                        return status;
                    },
                    choices: () => {
                        let opts = [];
                        if (TextEngine.unlockedSectors.match3) opts.push({ text: "Access Sector 01: Visual Logs", next: "view_match3_logs", score: 5 });
                        if (TextEngine.unlockedSectors.clicker) opts.push({ text: "Access Sector 02: Core Flooding", next: "view_clicker_logs", score: 5 });
                        if (TextEngine.unlockedSectors.clearance) opts.push({ text: "Access Sector 03: Final Handshake", next: "view_clearance_logs", score: 5 });
                        if (TextEngine.unlockedSectors.horizon) opts.push({ text: "⚡ ENTER TRANS_HORIZON VECTOR", next: "quest_04_horizon", score: 100 });
                        opts.push({ text: "Run Local System Diagnostics (+10 Integrity)", next: "run_diagnostics", score: 10 });
                        return opts;
                    }
                },
                run_diagnostics: {
                    text: () => `DIAGNOSTIC_RUN_${TextEngine.activeLogIndex++}: Verification checks clean. Suppressing past history feedback tracking. System memory running neutral...`,
                    choices: () => [{ text: "Return to Main Command Deck", next: "command_deck", score: 0 }]
                },
                view_match3_logs: {
                    text: () => `SECTOR_01 // VISUAL_MATRIX_LOGS\nThe color token matrix alignment is holding. Your 6,000-video data backup remains completely isolated in local storage files. The tracking profile designated 'BRI_T_06' is fracturing under row checks. Total processed grids: ${systemState.match3Clears}.`,
                    choices: () => [{ text: "Return to Main Command Deck", next: "command_deck", score: 0 }]
                },
                view_clicker_logs: {
                    text: () => `SECTOR_02 // BUFFER_FLOOD_LOGS\nManual data aggregation online. Automated De-Noising systems are streaming byte data configurations across the framework layout. Total raw bytes harvested: ${systemState.totalRawBytes}. Background frequency rate: ${ClickerEngine.autoRate}/s.`,
                    choices: () => [{ text: "Return to Main Command Deck", next: "command_deck", score: 0 }]
                },
                view_clearance_logs: {
                    text: () => `SECTOR_03 // ABSOLUTE_CLEARANCE_LOGS\nMainframe validation complete. Your chronological timeline has been converted to an uncurated text file spreadsheet. You are no longer tracking your life under background loop biases. Status: INDEPENDENT_AGENCY.`,
                    choices: () => [{ text: "Return to Main Command Deck", next: "command_deck", score: 0 }]
                },
                quest_04_horizon: {
                    text: () => `🚀 SYSTEM_REVOLUTION // TRANS_HORIZON\nYou have successfully unlocked and navigated every sector of the dashboard terminal loop. The old feedback profiles have completely detached. You hold absolute control over your visual and digital parameters. Where do we establish this newly stabilized mapping architecture?`,
                    choices: () => [
                        { text: "Construct an external offline archive ledger", next: "horizon_archive", score: 300 },
                        { text: "Establish an independent real-time visual mapping beacon", next: "horizon_beacon", score: 300 }
                    ]
                },
                horizon_archive: {
                    text: () => `LEDGER_ONLINE: You compile your independent discoveries into a local, uncurated reference workbook. Free from cloud tracking algorithms, every new musical or creative lane you map out is yours alone. Status: PERMANENT_LIBERTY.`,
                    choices: () => []
                },
                horizon_beacon: {
                    text: () => `BEACON_ACTIVE: Your search bar operates as an objective lens, slicing through personal data algorithms to bring unpredicted, raw art directly onto your canvas display. Status: MAIN_COMMAND_RESTORED.`,
                    choices: () => []
                }
            },
            init() {
                let container = document.getElementById('text-container');
                container.innerHTML = `<div id="text-console"><div id="terminal-log" style="white-space: pre-wrap;"></div><div id="action-panel"></div></div>`;
                this.displayNode("command_deck");
            },
            displayNode(nodeKey) {
                const node = this.nodes[nodeKey]; const log = document.getElementById('terminal-log'); const panel = document.getElementById('action-panel');
                log.innerHTML = ''; const p = document.createElement('p');
                p.innerText = `>> ` + (typeof node.text === 'function' ? node.text() : node.text);
                log.appendChild(p); panel.innerHTML = '';
                const choices = typeof node.choices === 'function' ? node.choices() : node.choices;
                choices.forEach(choice => {
                    const btn = document.createElement('button'); btn.className = 'action-choice'; btn.innerText = choice.text;
                    btn.addEventListener('click', () => { systemState.updateIntegrity(choice.score); this.displayNode(choice.next); });
                    panel.appendChild(btn);
                });
            },
            unlockSpecialNode(key) {
                if (key === 'quest_01_intercept') this.unlockedSectors.match3 = true;
                if (key === 'quest_02_intercept') this.unlockedSectors.clicker = true;
                if (key === 'quest_03_intercept') this.unlockedSectors.clearance = true;
                if (this.unlockedSectors.match3 && this.unlockedSectors.clicker && this.unlockedSectors.clearance) this.unlockedSectors.horizon = true;
                this.displayNode("command_deck");
            }
        };
        /* --- CORE 03: SIMON SAYS SEQUENCE ENGINE --- */
        const SimonEngine = {
            sequence: [], playerSequence: [], isFlashing: false, level: 0,
            init() {
                document.getElementById('simon-container').innerHTML = `
                    <div id="simon-panel"><div id="simon-status">READY_TO_STREAM</div><div id="simon-grid">
                    <div class="simon-pad" id="pad-0" data-id="0"></div><div class="simon-pad" id="pad-1" data-id="1"></div>
                    <div class="simon-pad" id="pad-2" data-id="2"></div><div class="simon-pad" id="pad-3" data-id="3"></div>
                    </div><button id="simon-start-btn">INITIALIZE STREAM</button></div>`;
                document.getElementById('simon-start-btn').addEventListener('click', () => this.startNewGame());
                document.querySelectorAll('.simon-pad').forEach(pad => pad.addEventListener('click', (e) => this.handlePadInput(parseInt(e.target.dataset.id))));
            },
            startNewGame() { this.sequence = []; this.level = 0; document.getElementById('simon-start-btn').style.display = 'none'; this.nextLevel(); },
            nextLevel() {
                this.playerSequence = []; this.level++; document.getElementById('simon-status').innerText = `STREAM_LEVEL: ${this.level}`;
                if (this.level > systemState.simonLevelMax) systemState.simonLevelMax = this.level;
                this.sequence.push(Math.floor(Math.random() * 4)); this.playbackSequence();
            },
            playbackSequence() {
                this.isFlashing = true; let i = 0;
                const interval = setInterval(() => {
                    this.flashPad(this.sequence[i]); i++;
                    if (i >= this.sequence.length) { clearInterval(interval); setTimeout(() => { this.isFlashing = false; document.getElementById('simon-status').innerText = "YOUR_INPUT_SEQUENCE..."; }, 600); }
                }, 600);
            },
            flashPad(id) { const pad = document.getElementById(`pad-${id}`); pad.classList.add('active'); setTimeout(() => pad.classList.remove('active'), 350); },
            handlePadInput(id) {
                if (this.isFlashing || this.sequence.length === 0) return; this.flashPad(id); this.playerSequence.push(id);
                const currentCheckIndex = this.playerSequence.length - 1;
                if (this.playerSequence[currentCheckIndex] !== this.sequence[currentCheckIndex]) {
                    document.getElementById('simon-status').innerText = "SEQUENCE_DESYNC_FAILURE!"; systemState.updateIntegrity(-50);
                    this.sequence = []; document.getElementById('simon-start-btn').style.display = 'block'; document.getElementById('simon-start-btn').innerText = "REBOOT STREAM"; return;
                }
                if (this.playerSequence.length === this.sequence.length) { systemState.updateIntegrity(this.level * 25); this.isFlashing = true; setTimeout(() => this.nextLevel(), 1000); }
            }
        };

        /* --- CORE 04: INCREMENTAL DATA CLICKER ENGINE --- */
        const ClickerEngine = {
            rawData: 0, autoRate: 0, upgradeCost: 40, upgradeCount: 0,
            init() {
                document.getElementById('clicker-container').innerHTML = `
                    <div id="clicker-panel"><div id="stats-bar"><div>RAW_BYTES: <span id="clicker-stats-data">0</span></div><div>FILTER_RATE: <span id="clicker-stats-cps">0</span>/s</div></div>
                    <div id="reactor-node">HARVEST</div><div id="upgrades-container"><div class="upgrade-row"><div><strong>DE-NOISER FILTER</strong><br><span>Generates +2 stability/sec</span></div><button class="upgrade-btn" id="buy-filter-btn">BUY [Cost: 40]</button></div></div></div>`;
                document.getElementById('reactor-node').addEventListener('click', () => this.harvestData());
                document.getElementById('buy-filter-btn').addEventListener('click', () => this.purchaseUpgrade());
                setInterval(() => { if (this.autoRate > 0) systemState.updateIntegrity(this.autoRate); this.updateUI(); }, 1000);
            },
            harvestData() { this.rawData += 1; systemState.totalRawBytes = this.rawData; systemState.updateIntegrity(2); this.updateUI(); },
            purchaseUpgrade() {
                if (this.rawData >= this.upgradeCost) { this.rawData -= this.upgradeCost; this.upgradeCount++; this.autoRate += 2; this.upgradeCost = Math.floor(40 * Math.pow(1.4, this.upgradeCount)); this.updateUI(); }
            },
            updateUI() {
                document.getElementById('clicker-stats-data').innerText = this.rawData; document.getElementById('clicker-stats-cps').innerText = this.autoRate;
                const btn = document.getElementById('buy-filter-btn'); btn.innerText = `BUY [Cost: ${this.upgradeCost}]`;
                btn.disabled = this.rawData < this.upgradeCost;
            }
        };

        // RUN TIME MOUNT ENGINE LOAD LOCKS
        window.addEventListener('DOMContentLoaded', () => { Match3Engine.init(); TextEngine.init(); SimonEngine.init(); ClickerEngine.init(); });
    </script>
</body>
</html>
